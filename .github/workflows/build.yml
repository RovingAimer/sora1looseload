name: Build loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python build.py
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: sora1looseload-${{ github.sha }}
          path: build/packages/*
          if-no-files-found: error
