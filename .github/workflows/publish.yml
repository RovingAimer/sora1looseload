name: Publish verified installation files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release_plan.json', '.github/workflows/publish.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build native source
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: |
            build/*.dll
            build/*report.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source and publish installation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
